<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Desktop Pet</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      font-family: "Microsoft YaHei", sans-serif;
    }
    /* ---------------- 虚拟视口 ----------------
       背景鼠标互动"开"（现状）：#viewport 铺满整个真实窗口，跟以前完全等价。
       背景鼠标互动"关"（桌面模式）：真实窗口本身铺满整个屏幕、对鼠标穿透，
       #viewport 变成一个本地模拟的"小窗口"（left/top/width/height 由 app.js
       写入内联样式），模型、气泡、聊天框等一切内容都跟着它走，缩放逻辑不用
       区分模式——这也是气泡限高/自适应能在两种模式下通用的原因。
       内联的 left/top/width/height 会覆盖这里的默认值，这里的 inset:0 只是
       页面刚加载、JS 还没跑到之前的兜底，效果等同于"开"模式。 */
    #viewport {
      position: fixed;
      inset: 0;
    }
    /* 场景背景层：位于 three.js 画布下方，无场景时为空（窗口保持透明） */
    #scene-bg {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    /* 裁圆角：场景地面等 3D 内容铺满窗口时会盖住 CSS 背景层的下圆角，这里把 WebGL 画布整体裁成圆角 */
    #app { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; }
    canvas { display: block; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #d33;
      background: rgba(20, 20, 30, 0.55);
      border-radius: 12px;
      font-size: 14px;
      z-index: 10;
    }
    #loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #e04060;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 气泡颜色通过 --bubble-* 变量按角色切换，默认是凛的红色。
       字号/内边距用 --vp-w（模型视口宽度，由 app.js 写入，以设计基准宽度 720 为 1:1）
       按比例换算，让气泡视觉上始终跟模型的大小成比例，不会显得过大或过小。
       --vp-w 没写入前（极早期）用 720 兜底，等价于原来的固定值。
       气泡本身不放在 #viewport 里面：桌面模式下 #viewport 只是被人为缩小、跟着
       模型走的一个小窗口，气泡放在里面能用的空间就只有这么大。气泡现在是 body
       的直接子元素、position:fixed 相对整个真实窗口（桌面模式=铺满的整个屏幕，
       普通模式=当前窗口本身），max-width 按真实窗口的百分比算，位置由 app.js 的
       updateBubbleAnchor() 贴着模型视口的正上方水平居中——看起来还是"长在模型
       头顶"，只是可用空间变成了整个窗口/屏幕，而不是那个被缩小的小视口。
       不限高、不内部滚动：想长多高就长多高，跟最早的设计一致。 */
    #bubble {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 92%;
      padding: clamp(5px, calc(var(--vp-w, 720) * 1px * 0.0097), 7px)
               clamp(8px, calc(var(--vp-w, 720) * 1px * 0.0194), 14px);
      background: rgba(255, 252, 250, 0.96);
      color: var(--bubble-color, #a02440);
      border: 2px solid var(--bubble-accent, #e04060);
      border-radius: 16px;
      font-size: clamp(11px, calc(var(--vp-w, 720) * 1px * 0.0194), 14px);
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      box-shadow: 0 4px 14px var(--bubble-shadow, rgba(160, 30, 60, 0.25));
      z-index: 5;
    }
    #bubble.show { pointer-events: auto; opacity: 1; }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: var(--bubble-accent, #e04060);
      border-bottom: 0;
    }
    /* 对话输入框：双击模型呼出，位于模型下方，3秒无操作自动收起（跟气泡的超时逻辑一致） */
    #chat-box {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      width: 78%;
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(255, 252, 250, 0.97);
      border: 2px solid rgba(224, 64, 96, 0.6);
      border-radius: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 4px 14px rgba(160, 30, 60, 0.2);
      z-index: 6;
    }
    #chat-box.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    /* 录音中：输入条描边变红做提示 */
    #chat-box.recording { border-color: #e04060; box-shadow: 0 0 0 3px rgba(224, 64, 96, 0.25); }
    /* 输入条两端的纯图标按钮（🎙 麦克风 / 📜 历史记录）共用同一套基础样式，
       首尾各放一个，撑起输入框，视觉上左右对称 */
    #chat-history-btn, #mic-btn {
      flex: none;
      border: none;
      background: transparent;
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #chat-history-btn:hover, #mic-btn:hover { background: rgba(224, 64, 96, 0.1); }
    /* 录音中：麦克风按钮变红高亮，明确表示"现在点一下是停止" */
    #mic-btn.recording { background: rgba(224, 64, 96, 0.18); color: #e04060; }
    #chat-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      color: #333;
    }
    #chat-input::placeholder { color: #bbb; }
    /* 📷 发图按钮，跟 📜 历史按钮同款；主界面暂不显示，但粘贴发图仍可用 */
    #img-btn {
      display: none;
    }
    /* 待发送图片的小缩略图，直接内嵌在输入条里（窗口小，不用 history.html 那种悬浮预览） */
    #img-preview {
      flex: none;
      position: relative;
      display: none;
      width: 24px;
      height: 24px;
    }
    #img-preview.show { display: block; }
    #img-preview img {
      width: 24px;
      height: 24px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
    #img-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      border: none;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    #hint {
      position: absolute;
      bottom: 6px;
      left: 0; right: 26px;
      text-align: center;
      color: rgba(60, 60, 60, 0.85);
      font-size: 11px;
      pointer-events: none;
    }
    #resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 24px;
      height: 24px;
      cursor: nwse-resize;
      z-index: 20;
      background: linear-gradient(135deg, transparent 46%, rgba(224, 64, 96, 0.6) 48%, rgba(224, 64, 96, 0.6) 62%, transparent 64%, transparent 76%, rgba(224, 64, 96, 0.6) 78%, rgba(224, 64, 96, 0.6) 92%, transparent 94%);
    }
    /* 桌面模式下背景对鼠标穿透，这个手柄贴在背景上也理应穿透，缩放改走椭圆按钮 */
    body.desktop-mode #resize-handle { display: none; }

    /* ---------------- 桌面模式：椭圆按钮 ----------------
       背景鼠标互动关闭时，场景/背景整体对鼠标点击穿透，唯独模型本体和这颗按钮
       仍能截获点击。固定摆在对话输入框正上方、水平居中，不跟着模型走。
       左半=拖拽移动模型在桌面上的位置，右半=拖拽缩放模型，右键=打开菜单。 */
    #desktop-anchor {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      width: 58px;
      height: 22px;
      border-radius: 11px;
      background: rgba(255, 252, 250, 0.88);
      border: 1.5px solid rgba(224, 64, 96, 0.55);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      z-index: 30;
      overflow: hidden;
    }
    body.desktop-mode #desktop-anchor { display: flex; }
    #desktop-anchor::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 3px;
      bottom: 3px;
      width: 1px;
      background: rgba(224, 64, 96, 0.35);
    }
    #desktop-anchor-move, #desktop-anchor-resize {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(160, 30, 60, 0.75);
      user-select: none;
    }
    #desktop-anchor-move { cursor: move; }
    #desktop-anchor-resize { cursor: nwse-resize; }
    #desktop-anchor-move:hover, #desktop-anchor-resize:hover { background: rgba(224, 64, 96, 0.12); }
    /* 桌面模式下 Shift/Ctrl 背景手势本来就失效了（背景不再接收鼠标事件），
       这条提示不该再出现；scene.js 会把它的 inline display 设成 inline，这里要用
       !important 才能盖过去 */
    body.desktop-mode #hint-scene { display: none !important; }
  </style>
</head>
<body>
  <div id="viewport" style="left: 0; top: 0; width: 100%; height: 100%;">
    <div id="scene-bg"></div>
    <div id="app"></div>
    <div id="chat-box">
      <button id="mic-btn" title="语音输入">🎙</button>
      <button id="img-btn" title="发送图片">📷</button>
      <input id="img-file" type="file" accept="image/*" style="display: none;" />
      <div id="img-preview">
        <img id="img-preview-el" alt="待发送图片" />
        <button id="img-remove" title="移除图片">×</button>
      </div>
      <input id="chat-input" type="text" maxlength="300" placeholder="想对TA说点什么…" />
      <button id="chat-history-btn" title="聊天记录">📜</button>
    </div>
    <div id="resize-handle" title="拖拽调整大小"></div>
    <div id="desktop-anchor" title="左半拖拽移动 · 右半拖拽缩放 · 右键菜单">
      <div id="desktop-anchor-move">✥</div>
      <div id="desktop-anchor-resize">⤡</div>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">正在召唤…</div>
    </div>
    <div id="hint"><span id="hint-main">点击模型互动 双击对话 长按滑动旋转 · 背景处拖拽移动 · 右键打开菜单 · 右下角缩放界面</span><span id="hint-scene" style="display:none"><br />背景：Shift+滚轮缩放 · Shift+拖拽移动 · Ctrl+滚轮前后 · Ctrl+拖拽旋转</span></div>
  </div>
  <!-- 气泡故意放在 #viewport 外面：position:fixed 相对真实窗口/屏幕定位，
       这样桌面模式下才能按整个屏幕的大小换算空间，而不是被缩小的虚拟视口卡住；
       位置由 app.js 的 updateBubbleAnchor() 贴到模型视口正上方 -->
  <div id="bubble"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script src="/public/image-utils.js"></script>
  <script type="module" src="/public/app.js"></script>
</body>
</html>
