<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>角色设定</title>
<style>
  body {
    font-family: "Microsoft YaHei", sans-serif;
    margin: 0;
    padding: 20px;
    background: #faf7f6;
    color: #333;
  }
  body > .section-title:first-child { margin-top: 0; }
  label { display: block; font-size: 12px; color: #777; margin: 12px 0 4px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #e04060; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    resize: vertical;
    min-height: 72px;
    line-height: 1.5;
  }
  textarea:focus { border-color: #e04060; }
  .section-title { margin: 22px 0 2px; font-size: 13px; color: #a02440; font-weight: bold; }
  .tip { font-size: 11px; color: #aaa; line-height: 1.6; margin: 4px 0 0; }
  #save-btn {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #e04060;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #save-btn:active { background: #c93454; }
  #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
  #status.ok { color: #2a8f4e; }
  #status.err { color: #c93454; }
</style>
</head>
<body>
  <div class="section-title">🌍 世界背景 <span class="who" style="font-weight: normal; color: #999;"></span></div>

  <textarea id="story_background" style="min-height: 90px" placeholder="角色所处世界的描述及设定"></textarea>

  <div class="section-title">🎭 角色资料 <span class="who" style="font-weight: normal; color: #999;"></span></div>

  <label>角色的个人资料</label>
  <textarea id="persona_system" style="min-height: 110px" placeholder="写角色的身份、性格、说话风格、和你的关系…&#10;例如：凛是一只傲娇的猫娘，嘴上总嫌弃你其实很黏人，说话简短带刺但会脸红…"></textarea>
  <label>角色别名（可选）</label>
  <input type="text" id="persona_aliases" placeholder="例如：远坂凛、凛（用 、 或 , 分隔）">
  <p class="tip">多角色语音用：故事里别的角色提到这个角色时可能用的其他称呼。AI 会被告知这些别名，朗读时也按别名认人。</p>

  <div class="section-title">🙋 你的资料 <span class="who" style="font-weight: normal; color: #999;"></span></div>

  <textarea id="reader_info" style="min-height: 100px" placeholder="写你的身份、和这个角色的关系…&#10;例如：姓名安运，男，21岁，是角色的老板；表面是默契的雇佣关系，实际更有种相互依赖的感觉…"></textarea>
  <p class="tip">你在这个角色面前扮演的身份，只对该角色生效，不同角色可以各填各的。</p>
  <p class="tip">保存后 生成/更新 角色的 persona.json 文件。以上内容全部清空后保存 = 删除该文件。</p>

  <button id="save-btn">保存</button>
  <div id="status"></div>

<script>
  const $ = (id) => document.getElementById(id);
  // 这个窗口编辑的角色：菜单里点哪个角色就是哪个
  const character = new URLSearchParams(location.search).get('character') || '';
  document.title = '角色设定 - ' + character;
  // 该角色的人设状态：null = 还没加载到（加载失败时会提示，此时保存不会动人设）
  let personaLoaded = null;

  // 状态提示：非错误类文案 2 秒后自动清空；err 常驻，等用户下次操作再被覆盖
  let statusTimer = null;
  function setStatus(text, cls) {
    const status = $('status');
    status.textContent = text || '';
    status.className = cls || '';
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    if (text && cls !== 'err') {
      statusTimer = setTimeout(() => {
        status.textContent = '';
        status.className = '';
      }, 2000);
    }
  }

  async function load() {
    try {
      const persona = await window.petAPI.getPersona(character);
      personaLoaded = persona;
      document.querySelectorAll('.who').forEach((el) => { el.textContent = '· ' + persona.characterName; });
      $('persona_system').value = persona.system || '';
      $('story_background').value = persona.storyBackground || '';
      $('persona_aliases').value = (persona.aliases || []).join('、');
      $('reader_info').value = persona.readerInfo || '';
    } catch (err) {
      setStatus('加载角色设定失败：' + (err && err.message ? err.message : String(err)), 'err');
    }
  }

  $('save-btn').addEventListener('click', async () => {
    // 加载失败时不动人设文件，避免用空表单把已有内容覆盖掉
    if (!personaLoaded) {
      setStatus('角色设定还没加载成功，无法保存', 'err');
      return;
    }
    setStatus('保存中…', '');
    try {
      // 四项都清空 = 删除 persona.json，之后不再发送
      await window.petAPI.savePersona(personaLoaded.characterName, {
        system: $('persona_system').value,
        storyBackground: $('story_background').value,
        aliases: $('persona_aliases').value,
        readerInfo: $('reader_info').value,
      });
      // 保存成功：不需要绿色"已保存"文案停留，直接关闭窗口
      window.close();
    } catch (err) {
      setStatus('保存失败：' + (err && err.message ? err.message : String(err)), 'err');
    }
  });

  load();
</script>
</body>
</html>
