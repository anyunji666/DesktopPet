<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>聊天记录</title>
<link rel="stylesheet" href="./history.css" />
</head>
<body>
  <div id="title-bar">
    <h2 id="title">聊天记录</h2>
    <div id="menu-wrap">
      <button id="menu-btn" title="更多操作">⋯</button>
      <div id="menu" class="hidden">
        <button id="menu-insert">插入消息</button>
        <button id="menu-export">导出聊天记录</button>
        <button id="menu-import">导入聊天记录</button>
        <button id="menu-clear" class="danger">清空对话</button>
      </div>
    </div>
  </div>
  <div id="list"></div>
  <div id="empty" style="display:none;">还没有聊天记录，双击角色呼出输入框试试吧～</div>

  <div id="toast"></div>

  <div id="input-bar">
    <button id="img-btn" title="发送图片">📷</button>
    <button id="mic-btn" title="语音输入">🎙</button>
    <input id="chat-input" type="text" maxlength="300" placeholder="想对TA说点什么…" />
    <button id="send-btn">发送</button>
  </div>
  <input id="img-file" type="file" accept="image/*" style="display: none;" />
  <div id="img-preview">
    <img id="img-preview-el" alt="待发送图片" />
    <button id="img-remove" title="移除图片">×</button>
  </div>

  <div id="insert-overlay" class="overlay hidden">
    <div id="insert-dialog">
      <div class="dialog-head">
        <span>插入消息</span>
        <button id="insert-close" title="关闭">×</button>
      </div>
      <div class="dialog-hint">手动补充一条聊天记录（不会触发生成回复）。直接输入或粘贴文本，选择消息归属即可。</div>
      <textarea id="insert-text" placeholder="输入要插入的消息内容…"></textarea>
      <div class="dialog-btns">
        <button id="insert-as-user">作为我说的插入</button>
        <button id="insert-as-assistant">作为TA说的插入</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="overlay hidden">
    <div id="confirm-dialog">
      <div id="confirm-msg"></div>
      <div class="dialog-btns">
        <button id="confirm-cancel">取消</button>
        <button id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

<script src="/public/image-utils.js"></script>
<script type="module" src="./history/index.js"></script>
</body>
</html>
